<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription - GENESIX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060b14;color:#fff;font-family:system-ui,sans-serif;padding:20px;text-align:center}
.logo{font-size:38px;font-weight:900;margin:30px 0 5px}.logo span{color:#d6ad55}
.card{background:#0e1726;border:1px solid rgba(214,173,85,.3);border-radius:20px;padding:22px;margin:20px auto;max-width:420px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:#09111f;color:#fff;margin-top:12px}
button{width:100%;padding:15px;border:0;border-radius:14px;font-weight:800;font-size:16px;margin-top:15px;cursor:pointer;background:linear-gradient(135deg,#d6ad55,#b98d35)}
a{color:#f1d58b;text-decoration:none;font-size:14px}
#msg{margin-top:12px;color:#ff8a8a;font-size:13px}
</style>
</head>
<body>
<div class="logo">GENE<span>SIX</span></div>
<p>Rejoins GENESIX et gagne tes premiers points 👊</p>
<div class="card">
<h2>Créer un compte</h2>
<input id="name" placeholder="Ton nom / pseudo">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Mot de passe (min 6)">
<input id="phone" placeholder="Numéro Mobile Money">
<button onclick="register()">Créer mon compte</button>
<p id="msg"></p>
<p style="margin-top:15px"><a href="login.html">Déjà un compte ? Se connecter →</a></p>
<p style="margin-top:10px"><a href="index.html">← Retour accueil</a></p>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyC27jn9ieCDcncnhC0FTrhVpgcppGeVDPY",
  authDomain: "genesix-81b12.firebaseapp.com",
  projectId: "genesix-81b12",
  storageBucket: "genesix-81b12.firebasestorage.app",
  messagingSenderId: "510952368030",
  appId: "1:510952368030:web:f4eafb07b6504008a4588f",
  measurementId: "G-9WG19JG7RC"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
window.register = async () => {
  const name=document.getElementById('name').value;
  const email=document.getElementById('email').value;
  const pass=document.getElementById('password').value;
  const phone=document.getElementById('phone').value;
  const msg=document.getElementById('msg');
  if(!name||!email||!pass){ msg.textContent="Remplis nom, email et mot de passe"; return; }
  if(pass.length<6){ msg.textContent="Mot de passe min 6 caractères"; return; }
  try{
    const cred = await createUserWithEmailAndPassword(auth,email,pass);
    const uid = cred.user.uid;
    const refBy = localStorage.getItem('genesix_ref') || new URLSearchParams(location.search).get('ref') || null;
    await setDoc(doc(db,"users",uid),{ name, email, phone, points:100, refBy: refBy||null, createdAt:new Date() });
    if(refBy && refBy!==uid){
      try{ await updateDoc(doc(db,"users",refBy),{points:increment(50)}); }catch(e){}
    }
    alert("Compte créé ✅ +100 pts de bienvenue !");
    location.href="index.html";
  }catch(e){ msg.textContent="Erreur : "+e.message; }
};
</script>
</body>
</html>
