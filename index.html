<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GENESIX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060b14;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:20px}
.logo{font-size:42px;font-weight:900;letter-spacing:3px;margin-top:15px}
.logo span{color:#d6ad55}
.top{display:flex;gap:10px;justify-content:center;margin:15px 0}
.top a{padding:10px 18px;border-radius:12px;text-decoration:none;font-weight:800;font-size:14px}
.login{background:#17263b;color:#fff;border:1px solid rgba(255,255,255,.2)}
.register{background:linear-gradient(135deg,#d6ad55,#b98d35);color:#000}
.card{background:#0e1726;border:1px solid rgba(214,173,85,.3);border-radius:20px;padding:20px;margin:15px auto;max-width:420px}
.points{font-size:50px;color:#f1d58b;font-weight:900}
button{width:100%;padding:15px;border:0;border-radius:14px;font-size:17px;font-weight:800;cursor:pointer;margin-top:12px}
.btn-gold{background:linear-gradient(135deg,#d6ad55,#b98d35);color:#000}
.btn-dark{background:#17263b;color:#fff;border:1px solid rgba(255,255,255,.15)}
input{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:#09111f;color:#fff;margin-top:10px}
small{color:#8d9bb0;line-height:1.6}
#status{margin-top:10px;color:#8d9bb0;font-size:13px}
</style>
</head>
<body>
<div class="logo">GENE<span>SIX</span></div>
<p><small>Tap • Gagne • Parraine • Retire</small></p>

<div id="authBtns" class="top">
<a class="login" href="login.html">Connexion</a>
<a class="register" href="register.html">Créer compte</a>
</div>

<div class="card">
<div>TES POINTS</div>
<div class="points" id="points">0</div>
<div id="status">Connexion...</div>
<button class="btn-gold" id="tapBtn">👆 TAP +1</button>
<button class="btn-dark" id="bonusBtn">🎁 Bonus +10</button>
<button class="btn-dark" id="logoutBtn" style="display:none">Déconnexion</button>
</div>

<div class="card">
<b>🔗 TON LIEN DE PARRAINAGE</b>
<input id="refLink" readonly value="Connecte-toi pour avoir ton lien">
<button class="btn-dark" onclick="copyRef()">Copier mon lien</button>
<p><small>+50 pts pour chaque ami qui s'inscrit avec ton lien.</small></p>
</div>

<div class="card">
<b>💰 RETRAIT</b>
<input id="phone" placeholder="Numéro Mobile Money ex: +243...">
<button class="btn-gold" onclick="withdraw()">Demander retrait (Min 5000 pts)</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, increment, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyC27jn9ieCDcncnhC0FTrhVpgcppGeVDPY",
  authDomain: "genesix-81b12.firebaseapp.com",
  projectId: "genesix-81b12",
  storageBucket: "genesix-81b12.firebasestorage.app",
  messagingSenderId: "510952368030",
  appId: "1:510952368030:web:f4eafb07b6504008a4588f",
  measurementId: "G-9WG19JG7RC"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
let uid=null, myPoints=0;
const urlParams = new URLSearchParams(location.search);
localStorage.setItem('genesix_ref', urlParams.get('ref') || localStorage.getItem('genesix_ref') || '');

onAuthStateChanged(auth, async (user)=>{
  if(!user){
    document.getElementById('status').textContent="Non connecté - Crée un compte";
    return;
  }
  uid=user.uid;
  document.getElementById('authBtns').style.display='none';
  document.getElementById('logoutBtn').style.display='block';
  document.getElementById('status').textContent="Connecté ✅ "+user.email;
  document.getElementById('refLink').value=location.origin+location.pathname+"?ref="+uid;
  const ref=doc(db,"users",uid);
  const snap=await getDoc(ref);
  if(snap.exists()){ myPoints=snap.data().points||0; document.getElementById('points').textContent=myPoints; }
});
async function addPoints(n){
  if(!uid) return location.href="login.html";
  myPoints+=n; document.getElementById('points').textContent=myPoints;
  await updateDoc(doc(db,"users",uid),{points:increment(n)});
}
document.getElementById('tapBtn').onclick=()=>addPoints(1);
document.getElementById('bonusBtn').onclick=()=>addPoints(10);
document.getElementById('logoutBtn').onclick=()=>signOut(auth).then(()=>location.reload());
window.copyRef=()=>{
  const el=document.getElementById('refLink'); el.select(); document.execCommand('copy'); alert("Lien copié ✅");
};
window.withdraw=async()=>{
  const phone=document.getElementById('phone').value;
  if(!uid) return location.href="login.html";
  if(!phone) return alert("Mets ton numéro");
  if(myPoints<5000) return alert("Il faut 5000 pts. Tu as "+myPoints);
  await addDoc(collection(db,"withdrawals"),{uid,phone,points:myPoints,date:new Date(),status:"en attente"});
  alert("Demande envoyée ✅");
};
</script>
</body>
</html>
